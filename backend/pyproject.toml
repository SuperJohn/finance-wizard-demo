[project]
name = "finance-wizard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "duckdb>=1.1", "httpx>=0.27", "numpy>=1.26", "pandas>=2.2"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
